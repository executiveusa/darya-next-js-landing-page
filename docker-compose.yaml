version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_DEFAULT_MODEL: claude-3-sonnet
    depends_on:
      - backend

  backend:
    image: ghcr.io/executiveusa/synthia-backend:latest
    ports:
      - "8080:8080"
    environment:
      GOOGLE_PROJECT_ID: local-synthia
      ANTHROPIC_API_KEY: changeme
      OPENROUTER_API_KEY: changeme
      OLLAMA_BASE_URL: http://ollama:11434

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:

