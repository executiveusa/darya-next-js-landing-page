name: Frontend CI

on:
  push:
    branches: [work, main]
  pull_request:
    branches: [work, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Playwright MCP Audit (placeholder)
        run: |
          echo "Playwright MCP audit to be implemented"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Docker Build
        run: docker build -f Dockerfile.frontend -t synthia-frontend .

